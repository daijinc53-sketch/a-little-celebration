<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#96104f" />
  <title>虎杖悠仁からの誕生日メッセージ</title>
  <style>
    :root { --berry:#96104f; --deep:#260d23; --red:#c33151; --gold:#ffd58c; --paper:#f7efdf; --ink:#392b39; }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; }
    body { min-height:100svh; overflow:hidden; color:#fff4eb; background:radial-gradient(ellipse at 68% 45%,#b32362 0,transparent 42%),radial-gradient(ellipse at 50% 100%,#3b0c30 0,transparent 52%),linear-gradient(145deg,#92104d,#651039); font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif; }
    .poster { position:relative; display:flex; min-height:100svh; flex-direction:column; isolation:isolate; overflow:hidden; }
    .poster::before { content:""; position:absolute; z-index:-1; inset:18px; border:1px solid rgba(255,218,158,.34); box-shadow:inset 0 0 42px rgba(255,213,144,.045); pointer-events:none; }
    .poster::after { content:""; position:absolute; z-index:-1; inset:25px; border:1px solid rgba(255,218,165,.14); pointer-events:none; }
    .topbar { position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:clamp(28px,5vh,52px) clamp(36px,8vw,110px) 0; font:10px Arial,sans-serif; letter-spacing:.18em; }
    .back { color:rgba(255,244,235,.76); text-decoration:none; transition:color .2s; }
    .back:hover { color:#fff; }
    .back span { margin-right:8px; color:var(--gold); font-size:16px; vertical-align:-2px; }
    .top-note { color:rgba(255,223,176,.66); text-align:right; }
    .hero { position:relative; display:grid; grid-template-columns:minmax(310px,.9fr) minmax(350px,1.1fr); align-items:center; width:min(1100px,88vw); flex:1; gap:clamp(12px,3vw,44px); margin:0 auto; padding:24px 0 44px; }
    .letter { position:relative; z-index:1; padding:clamp(28px,4.5vw,58px); color:var(--ink); background:linear-gradient(145deg,#fff8e9,#efe2c9); border:1px solid rgba(255,234,195,.9); box-shadow:0 24px 64px rgba(24,0,19,.32); transform:rotate(-1.4deg); animation:letterArrive .9s cubic-bezier(.2,.8,.2,1) both; }
    .letter::before { content:""; position:absolute; inset:10px; border:1px solid rgba(151,99,73,.25); pointer-events:none; }
    .letter-kicker { margin:0 0 23px; color:#a14c68; font:9px Arial,sans-serif; letter-spacing:.25em; }
    .recipient { margin:0 0 8px; color:rgba(57,43,57,.55); font:9px Arial,sans-serif; letter-spacing:.2em; }
    h1 { margin:0; color:#9a2859; font-size:clamp(32px,3.6vw,43px); font-weight:400; font-style:normal; line-height:1.18; letter-spacing:-.03em; }
    h1 span { display:block; white-space:nowrap; font-size:.88em; }
    .rule { display:flex; align-items:center; gap:10px; margin:20px 0; color:#ba8155; font-size:12px; }
    .rule::before,.rule::after { content:""; width:40px; height:1px; background:rgba(160,117,78,.4); }
    .message { margin:0; font-size:clamp(14px,1.5vw,17px); font-style:italic; line-height:1.9; }
    .signoff { margin:24px 0 0; color:#91375e; font-size:19px; font-style:italic; }
    .signature { display:flex; justify-content:space-between; align-items:end; gap:12px; margin-top:27px; padding-top:14px; border-top:1px solid rgba(151,99,73,.25); }
    .signature strong { color:#2f2030; font-size:17px; font-weight:400; font-style:italic; }
    .signature small { color:rgba(57,43,57,.58); font:9px Arial,sans-serif; letter-spacing:.15em; }
    .character-wrap { position:relative; display:grid; place-items:center; min-height:500px; }
    .aura { position:absolute; width:min(42vw,470px); aspect-ratio:1; border:1px solid rgba(255,213,140,.23); border-radius:50%; box-shadow:0 0 48px rgba(255,100,139,.19),inset 0 0 55px rgba(255,181,129,.11); animation:auraPulse 3.6s ease-in-out infinite; }
    .aura::before,.aura::after { content:""; position:absolute; inset:9%; border:1px solid rgba(255,220,160,.15); border-radius:50%; transform:rotate(-24deg); }
    .aura::after { inset:19%; transform:rotate(37deg); border-style:dashed; }
    .energy { position:absolute; z-index:0; width:90%; height:85%; overflow:visible; filter:drop-shadow(0 0 7px rgba(255,87,132,.6)); }
    .energy path { fill:none; stroke:rgba(255,125,154,.62); stroke-width:2; stroke-linecap:round; stroke-dasharray:8 15; animation:energyFlow 4s linear infinite; }
    .official-art { position:relative; z-index:1; display:grid; place-items:center; width:min(34vw,350px); height:min(68vh,560px); overflow:visible; filter:drop-shadow(0 16px 24px rgba(25,0,22,.34)) drop-shadow(0 0 16px rgba(255,205,145,.16)); animation:yujiEnter 1.1s cubic-bezier(.2,.8,.2,1) both; }
    .yuji-figure { position:relative; z-index:1; display:block; width:100%; height:100%; object-fit:contain; animation:yujiBreathe 3.2s ease-in-out 1.1s infinite; }
    .spark { position:absolute; z-index:2; color:#ffe2a4; font-size:19px; text-shadow:0 0 12px #ffcf7b; animation:sparkFloat 2.4s ease-in-out infinite alternate; }
    .spark.one { left:9%; top:26%; }.spark.two { right:7%; top:34%; animation-delay:-1.2s; }.spark.three { left:19%; bottom:21%; font-size:12px; animation-delay:-.6s; }
    .page-foot { position:relative; z-index:2; display:flex; justify-content:center; padding:0 20px 28px; color:rgba(255,226,190,.46); font:8px Arial,sans-serif; letter-spacing:.2em; text-align:center; }
    @keyframes auraPulse { 0%,100%{opacity:.58;transform:scale(.96)} 50%{opacity:1;transform:scale(1.045)} }
    @keyframes energyFlow { to{stroke-dashoffset:-92} }
    @keyframes yujiBreathe { 0%,100%{transform:translateY(0) rotate(-.6deg)} 50%{transform:translateY(-9px) rotate(.8deg)} }
    @keyframes yujiEnter { from{opacity:0;transform:translateY(24px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
    @keyframes sparkFloat { from{transform:translateY(5px) scale(.82);opacity:.55} to{transform:translateY(-10px) scale(1.12);opacity:1} }
    @keyframes letterArrive { from{opacity:0;transform:translateY(20px) rotate(-3deg)} to{opacity:1;transform:translateY(0) rotate(-1.4deg)} }
    @media (max-width:760px) {
      body { overflow:auto; }
      .poster { min-height:100svh; }
      .topbar { padding:30px 32px 0; }
      .top-note { max-width:115px; line-height:1.6; }
      .hero { display:flex; width:min(570px,86vw); flex-direction:column; gap:4px; padding:42px 0 28px; }
      .letter { order:1; width:100%; padding:28px 30px; }
      .character-wrap { order:2; width:100%; min-height:390px; }
      .official-art { width:min(68vw,270px); height:400px; }
      .aura { width:min(70vw,340px); }
      h1 { font-size:clamp(34px,8.5vw,42px); }
      .page-foot { padding-bottom:24px; }
    }
    @media (min-width:761px) and (max-height:700px) {
      body { overflow:auto; }
      .hero { min-height:0; padding:10px 0 16px; }
      .character-wrap { min-height:min(74vh,440px); }
      .official-art { height:min(72vh,410px); }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; } }
  </style>
</head>

      <a class="back" href="./"><span>↖</span> お祝いページへ戻る</a>
      <span class="top-note">10月26日、君の特別な日</span>
    </header>
    <section class="hero" aria-label="虎杖悠仁からの誕生日メッセージ">
      <article class="letter">
        <p class="letter-kicker">呪術高専 · バースデーメッセージ</p>
        <p class="recipient">ジャルへ</p>
        <h1>誕生日<br /><span>おめでとう！</span></h1>
        <div class="rule">✦</div>
        <p class="message">やあ、ジャル！誕生日おめでとう！今日はおいしいものをたくさん食べて、思いきり笑って、最高の日にしよう。新しい一年も、焦らずジャルのペースで大丈夫。オレもずっと応援してるからな！あっ、ケーキひと切れ残しといて！</p>
        <p class="signoff">最高の一日にしよう！</p>
        <div class="signature"><strong>— 虎杖悠仁</strong><small>10月26日</small></div>
      </article>

    (() => {
      const art = document.querySelector(".yuji-figure");
      const source = art?.getAttribute("src") || "";
      if (!source.startsWith("data:image/png;base64,")) return;
      const binary = atob(source.slice(source.indexOf(",") + 1));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      art.src = URL.createObjectURL(new Blob([bytes], { type: "image/png" }));
